<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; background: #ffffff; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: inherit; text-decoration: none; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #ffffff; display: flex; flex-direction: column; padding: 20px; gap: 24px; overflow: hidden;">

  <div style="display: flex; align-items: center; justify-content: center; position: relative; padding: 8px 0 0 0;">
    <a href="Amount.dc.html" style="position: absolute; left: 0; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M15 5L8 12L15 19" stroke="#1d1d1f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>
    <div style="font-size: 17px; font-weight: 600; color: #1d1d1f;">Cash out</div>
  </div>

  <div style="background: #f5f5f7; border-radius: 16px; padding: 16px 18px; display: flex; align-items: center; justify-content: space-between;">
    <div style="font-size: 14px; color: #6e6e73;">You're sending</div>
    <div style="font-size: 17px; font-weight: 600; color: #1d1d1f;">300.00 USDC</div>
  </div>

  <div style="font-size: 15px; font-weight: 600; color: #1d1d1f;">Choose how to receive it</div>

  <div style="display: flex; flex-direction: column; gap: 10px;">
    <sc-for list="{{rails}}" as="item" hint-placeholder-count="3">
      <div onClick="{{item.pick}}" style="display: flex; align-items: center; gap: 14px; padding: 16px; border: 1.5px solid {{item.cardBorder}}; border-radius: 16px; cursor: pointer;">
        <div style="width: 40px; height: 40px; border-radius: 999px; background: #f5f5f7; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
          <sc-if value="{{item.isBank}}" hint-placeholder-val="{{true}}">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M3 10L12 4L21 10" stroke="#1d1d1f" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 10V19M10 10V19M14 10V19M19 10V19" stroke="#1d1d1f" stroke-width="1.7" stroke-linecap="round"/><path d="M4 19H20" stroke="#1d1d1f" stroke-width="1.7" stroke-linecap="round"/></svg>
          </sc-if>
          <sc-if value="{{item.isMomo}}" hint-placeholder-val="{{false}}">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><rect x="7" y="3" width="10" height="18" rx="2" stroke="#1d1d1f" stroke-width="1.7"/><path d="M11 18H13" stroke="#1d1d1f" stroke-width="1.7" stroke-linecap="round"/></svg>
          </sc-if>
          <sc-if value="{{item.isAgent}}" hint-placeholder-val="{{false}}">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="3.4" stroke="#1d1d1f" stroke-width="1.7"/><path d="M5 20c0-3.9 3.1-6 7-6s7 2.1 7 6" stroke="#1d1d1f" stroke-width="1.7" stroke-linecap="round"/></svg>
          </sc-if>
        </div>
        <div style="flex: 1; min-width: 0;">
          <div style="font-size: 15px; font-weight: 600; color: #1d1d1f;">{{item.title}}</div>
          <div style="font-size: 13px; color: #6e6e73; margin-top: 2px;">{{item.subtitle}}</div>
        </div>
        <div style="width: 22px; height: 22px; border-radius: 999px; border: 2px solid {{item.radioBorder}}; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
          <sc-if value="{{item.isSelected}}" hint-placeholder-val="{{true}}">
            <div style="width: 11px; height: 11px; border-radius: 999px; background: #1d1d1f;"></div>
          </sc-if>
        </div>
      </div>
    </sc-for>
  </div>

  <a href="Review.dc.html" style="display: flex; align-items: center; justify-content: center; background: #1d1d1f; color: #ffffff; border-radius: 16px; padding: 16px 0; font-size: 16px; font-weight: 600; margin-top: auto;">Continue</a>
</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const selected = (this.state && this.state.selected) || 'bank';
    const base = [
      { id: 'bank', title: 'Bank transfer', subtitle: '1 business day · GTBank, Access, Zenith + more' },
      { id: 'momo', title: 'Mobile money', subtitle: 'Instant · MTN, Airtel, OPay' },
      { id: 'agent', title: 'Cash pickup', subtitle: 'Same day · Partner agent locations' }
    ];
    const rails = base.map((r) => {
      const isSelected = r.id === selected;
      return {
        ...r,
        isBank: r.id === 'bank',
        isMomo: r.id === 'momo',
        isAgent: r.id === 'agent',
        isSelected: isSelected,
        cardBorder: isSelected ? '#1d1d1f' : '#e5e5ea',
        radioBorder: isSelected ? '#1d1d1f' : '#c7c7cc',
        pick: () => this.setState({ selected: r.id })
      };
    });
    return { rails };
  }
}
</script>
</body>
</html>
