<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; background: #ffffff; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: inherit; text-decoration: none; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #ffffff; display: flex; flex-direction: column; padding: 20px; gap: 24px; overflow: hidden;">

  <div style="display: flex; align-items: center; position: relative; padding: 8px 0 0 0;">
    <a href="Welcome.dc.html" style="width: 36px; height: 36px; display: flex; align-items: center; justify-content: center;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M15 5L8 12L15 19" stroke="#1d1d1f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>
    <div style="font-size: 13px; color: #6e6e73; font-weight: 500;">Step 1 of 2</div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px;">
    <div style="font-size: 26px; font-weight: 600; color: #1d1d1f; letter-spacing: -0.4px;">Create your wallet</div>
    <div style="font-size: 15px; color: #6e6e73; line-height: 1.5;">Your wallet is created and secured through Pollar. You hold the keys — Kero never has access to your funds.</div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px;">
    <sc-for list="{{options}}" as="item" hint-placeholder-count="2">
      <div onClick="{{item.pick}}" style="display: flex; align-items: center; gap: 14px; padding: 18px; border: 1.5px solid {{item.cardBorder}}; border-radius: 16px; cursor: pointer;">
        <div style="width: 40px; height: 40px; border-radius: 999px; background: #f5f5f7; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
          <sc-if value="{{item.isNew}}" hint-placeholder-val="{{true}}">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 5V19M5 12H19" stroke="#1d1d1f" stroke-width="1.8" stroke-linecap="round"/></svg>
          </sc-if>
          <sc-if value="{{item.isImport}}" hint-placeholder-val="{{false}}">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 4V15M7 10L12 15L17 10" stroke="#1d1d1f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 18H19" stroke="#1d1d1f" stroke-width="1.8" stroke-linecap="round"/></svg>
          </sc-if>
        </div>
        <div style="flex: 1; min-width: 0;">
          <div style="font-size: 15px; font-weight: 600; color: #1d1d1f;">{{item.title}}</div>
          <div style="font-size: 13px; color: #6e6e73; margin-top: 2px;">{{item.subtitle}}</div>
        </div>
        <div style="width: 22px; height: 22px; border-radius: 999px; border: 2px solid {{item.radioBorder}}; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
          <sc-if value="{{item.isSelected}}" hint-placeholder-val="{{true}}">
            <div style="width: 11px; height: 11px; border-radius: 999px; background: #1d1d1f;"></div>
          </sc-if>
        </div>
      </div>
    </sc-for>
  </div>

  <a href="Onboarding-Identity.dc.html" style="display: flex; align-items: center; justify-content: center; background: #1d1d1f; color: #ffffff; border-radius: 16px; padding: 16px 0; font-size: 16px; font-weight: 600; margin-top: auto;">Continue</a>
</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const selected = (this.state && this.state.selected) || 'new';
    const base = [
      { id: 'new', title: 'Create new wallet', subtitle: 'Recommended for first-time users' },
      { id: 'import', title: 'Import existing wallet', subtitle: 'Restore with a recovery phrase' }
    ];
    const options = base.map((o) => {
      const isSelected = o.id === selected;
      return {
        ...o,
        isNew: o.id === 'new',
        isImport: o.id === 'import',
        isSelected: isSelected,
        cardBorder: isSelected ? '#1d1d1f' : '#e5e5ea',
        radioBorder: isSelected ? '#1d1d1f' : '#c7c7cc',
        pick: () => this.setState({ selected: o.id })
      };
    });
    return { options };
  }
}
</script>
</body>
</html>
