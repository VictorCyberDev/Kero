<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; background: #ffffff; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: inherit; text-decoration: none; }
    button { font-family: inherit; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #ffffff; display: flex; flex-direction: column; padding: 20px; gap: 24px; overflow: hidden;">

  <div style="display: flex; align-items: center; justify-content: center; position: relative; padding: 8px 0 0 0;">
    <a href="Home.dc.html" style="position: absolute; left: 0; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M15 5L8 12L15 19" stroke="#1d1d1f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>
    <div style="font-size: 17px; font-weight: 600; color: #1d1d1f;">Cash out</div>
  </div>

  <div style="display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 12px 0 4px 0;">
    <div style="font-size: 13px; color: #6e6e73;">Available: 1,240.00 USDC</div>
    <div style="display: flex; align-items: baseline; gap: 8px;">
      <div style="font-size: 52px; font-weight: 600; letter-spacing: -1px; color: #1d1d1f;">{{amount}}</div>
      <div style="font-size: 18px; font-weight: 500; color: #6e6e73;">USDC</div>
    </div>
    <button onClick="{{setMax}}" style="border: 1.5px solid #e5e5ea; border-radius: 999px; padding: 6px 14px; font-size: 12px; font-weight: 600; color: #1d1d1f; background: #ffffff; margin-top: 4px;">Max</button>
  </div>

  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px;">
    <sc-for list="{{keys}}" as="item" hint-placeholder-count="12">
      <button onClick="{{item.press}}" style="height: 60px; border: none; border-radius: 14px; background: #f5f5f7; font-size: 22px; font-weight: 500; color: #1d1d1f;">{{item.label}}</button>
    </sc-for>
  </div>

  <a href="CashOut.dc.html" style="display: flex; align-items: center; justify-content: center; background: #1d1d1f; color: #ffffff; border-radius: 16px; padding: 16px 0; font-size: 16px; font-weight: 600; margin-top: auto;">Continue</a>
</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const amount = (this.state && this.state.amount) || '300';
    const labels = ['1', '2', '3', '4', '5', '6', '7', '8', '9', '.', '0', '⌫'];
    const keys = labels.map((label) => ({
      label: label,
      press: () => {
        let a = (this.state && this.state.amount) || '300';
        if (label === '⌫') {
          a = a.length > 1 ? a.slice(0, -1) : '0';
        } else if (label === '.' ) {
          if (!a.includes('.')) { a = a + '.'; }
        } else {
          a = a === '0' ? label : a + label;
        }
        this.setState({ amount: a });
      }
    }));
    const setMax = () => this.setState({ amount: '1240.00' });
    return { amount, keys, setMax };
  }
}
</script>
</body>
</html>
